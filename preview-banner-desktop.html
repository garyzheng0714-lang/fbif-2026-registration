<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面端长图方案对比</title>
<style>
  :root {
    --bg: #f2f3f5;
    --surface: #ffffff;
    --ink: #1f2329;
    --muted: #646a73;
    --deep-blue: #0f5fc2;
    --radius-lg: 9px;
    --content-width: 860px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'PingFang SC', 'SF Pro Text', 'Noto Sans SC', sans-serif;
    background: var(--bg);
  }
  .content {
    max-width: var(--content-width);
    margin: 0 auto;
    padding: 12px;
  }
  .fake-form {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 32px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 16px;
    border: 1px solid #e8e9ec;
  }
  .divider {
    text-align: center;
    color: var(--deep-blue);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 40px 0 16px;
    max-width: var(--content-width);
    margin: 0 auto;
  }
  .divider-sub {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 400;
    margin-top: 4px;
  }
  hr {
    border: none;
    border-top: 2px dashed #dee0e3;
    max-width: var(--content-width);
    margin: 40px auto;
  }

  /* ==============================
     方案 1：全宽突破 Full Bleed
     - 图片突破容器，撑满屏幕
     - 手机端照旧在容器内
     ============================== */
  .fullbleed-section {
    width: 100%;
    background: var(--surface);
    border-top: 1px solid #e8e9ec;
    margin-top: 16px;
  }
  .fullbleed-section img {
    display: block;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
  }

  /* 折叠态 */
  .fullbleed-section.is-collapsed {
    position: relative;
    max-height: 320px;
    overflow: hidden;
  }
  .fullbleed-section.is-collapsed .fb-glass {
    display: flex;
  }
  .fullbleed-section.is-expanded .fb-glass {
    display: none;
  }
  .fullbleed-section.is-expanded .fb-collapse {
    display: block;
  }
  .fullbleed-section.is-expanded {
    max-height: none;
  }
  .fb-glass {
    display: none;
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.7) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 14px;
  }
  .fb-btn {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 5px 14px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: none;
    border-radius: 16px;
    color: var(--deep-blue);
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  .fb-btn svg { width: 12px; height: 12px; }
  .fb-collapse {
    display: none;
    text-align: center;
    padding: 10px 0;
    background: var(--surface);
    border: none;
    width: 100%;
    color: var(--muted);
    font-size: 0.75rem;
    cursor: pointer;
    border-top: 1px solid #f0f1f3;
  }

  /* ==============================
     方案 2：容器内 + 桌面端限高
     - 桌面端 max-height 限制
     - 保持圆角容器
     ============================== */
  .contained-wrap {
    max-width: var(--content-width);
    margin: 16px auto 0;
    padding: 0 12px;
  }
  .contained-inner {
    border-radius: var(--radius-lg);
    overflow: hidden;
    position: relative;
  }
  .contained-inner.is-collapsed {
    max-height: 280px;
  }
  .contained-inner.is-expanded {
    max-height: none;
  }
  .contained-inner img {
    display: block;
    width: 100%;
  }
  .contained-inner .ct-glass {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    background: linear-gradient(to bottom, transparent 0%, rgba(242,243,245,0.6) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 12px;
  }
  .contained-inner.is-expanded .ct-glass { display: none; }
  .ct-btn {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 5px 14px;
    background: rgba(255,255,255,0.85);
    border: none;
    border-radius: 16px;
    color: var(--deep-blue);
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  .ct-btn svg { width: 12px; height: 12px; }
  .ct-collapse {
    display: none;
    max-width: var(--content-width);
    margin: 4px auto 0;
    padding: 0 12px;
    text-align: center;
  }
  .ct-collapse button {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.75rem;
    cursor: pointer;
    padding: 10px 0;
  }
  .contained-inner.is-expanded ~ .ct-collapse { display: block; }

  /* ==============================
     方案 3：全宽突破 + 不折叠
     - 直接展示完整图片
     - 图片居中，有最大宽度
     ============================== */
  .bleed-full {
    width: 100%;
    background: var(--surface);
    border-top: 1px solid #e8e9ec;
    padding: 0;
    margin-top: 16px;
  }
  .bleed-full img {
    display: block;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<!-- 模拟表单区域 -->
<div class="content">
  <div class="fake-form">
    -- 表单 / 角色选择区域（省略）--
  </div>
</div>

<!-- ===== 方案 1 ===== -->
<div class="divider">
  方案 1 — 全宽突破 + 毛玻璃折叠
  <div class="divider-sub">图片突破容器撑满屏幕宽度，白色背景衬底，桌面端不会有灰色留白</div>
</div>
<div class="fullbleed-section is-collapsed" id="fb1">
  <img src="https://fbif-feishu-base.oss-cn-shanghai.aliyuncs.com/fbif-attachment-to-url/2026/03/tblMQeXvSGd7Hebf_9bfWWOLMJCrLLXuXbNBYvw_1772521003101/20260303-145607_1772521004287.png" alt="">
  <div class="fb-glass">
    <button class="fb-btn" onclick="toggleFb('fb1')">
      展开全部
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>
  <button class="fb-collapse" onclick="toggleFb('fb1')">收起 ∧</button>
</div>

<hr>

<!-- ===== 方案 2 ===== -->
<div class="divider">
  方案 2 — 容器内 + 桌面端限高（当前方案优化）
  <div class="divider-sub">保持在内容容器内，桌面端限制高度更低，两侧有灰色背景</div>
</div>
<div class="contained-wrap">
  <div class="contained-inner is-collapsed" id="ct1">
    <img src="https://fbif-feishu-base.oss-cn-shanghai.aliyuncs.com/fbif-attachment-to-url/2026/03/tblMQeXvSGd7Hebf_9bfWWOLMJCrLLXuXbNBYvw_1772521003101/20260303-145607_1772521004287.png" alt="">
    <div class="ct-glass">
      <button class="ct-btn" onclick="toggleCt('ct1')">
        展开全部
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
  </div>
  <div class="ct-collapse"><button onclick="toggleCt('ct1')">收起 ∧</button></div>
</div>

<hr>

<!-- ===== 方案 3 ===== -->
<div class="divider">
  方案 3 — 全宽突破 + 不折叠（最简单）
  <div class="divider-sub">直接全部展示，图片限制最大宽度 680px 居中，白色衬底</div>
</div>
<div class="bleed-full">
  <img src="https://fbif-feishu-base.oss-cn-shanghai.aliyuncs.com/fbif-attachment-to-url/2026/03/tblMQeXvSGd7Hebf_9bfWWOLMJCrLLXuXbNBYvw_1772521003101/20260303-145607_1772521004287.png" alt="">
</div>

<div style="height:60px"></div>

<script>
function toggleFb(id) {
  const el = document.getElementById(id);
  if (el.classList.contains('is-collapsed')) {
    el.classList.remove('is-collapsed');
    el.classList.add('is-expanded');
  } else {
    el.classList.remove('is-expanded');
    el.classList.add('is-collapsed');
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
function toggleCt(id) {
  const el = document.getElementById(id);
  if (el.classList.contains('is-collapsed')) {
    el.classList.remove('is-collapsed');
    el.classList.add('is-expanded');
  } else {
    el.classList.remove('is-expanded');
    el.classList.add('is-collapsed');
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
</script>
</body>
</html>
