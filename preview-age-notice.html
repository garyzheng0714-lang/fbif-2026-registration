<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>预览 - 年龄提示方案对比</title>
<style>
  :root {
    --bg: #f2f3f5;
    --surface: #ffffff;
    --ink: #1f2329;
    --muted: #646a73;
    --deep-blue: #0f5fc2;
    --danger: #e55e55;
    --radius-lg: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'PingFang SC', 'SF Pro Text', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    max-width: 430px;
    margin: 0 auto;
    padding: 12px;
    color: var(--ink);
  }
  .label {
    font-size: 0.72rem;
    color: #999;
    margin: 24px 0 8px;
    text-align: center;
    letter-spacing: 1px;
  }
  .label:first-child { margin-top: 0; }
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: 0 1px 3px rgba(31,35,41,0.06);
  }
  .card-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .card-sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .role-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .role-option {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
    align-items: center;
    gap: 14px;
    padding: 14px;
    border: 1.5px solid #e8e9ec;
    border-radius: 10px;
    background: var(--surface);
    cursor: pointer;
    text-align: left;
    width: 100%;
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }
  .role-option.is-active {
    border-color: var(--deep-blue);
    box-shadow: 0 0 0 3px rgba(15, 95, 194, 0.12);
  }
  .role-icon {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--deep-blue), #2c62be);
    color: #ffffff;
    display: grid;
    place-items: center;
  }
  .role-icon svg { width: 22px; height: 22px; }
  .role-content { display: grid; gap: 2px; }
  .role-title { font-size: 0.95rem; font-weight: 700; }
  .role-tag {
    display: inline-block; font-size: 0.65rem; padding: 1px 5px;
    border-radius: 3px; margin-left: 6px; font-weight: 600;
    vertical-align: middle; position: relative; top: -1px;
  }
  .role-tag.need { background: #fff3e0; color: #e67e22; }
  .role-tag.free { background: #ecfdf5; color: #27ae60; }
  .role-desc { color: var(--muted); font-size: 0.82rem; line-height: 1.45; }
  .role-num { font-weight: 800; color: var(--deep-blue); font-size: 1.05em; }

  /* 方案 A: 融入副标题 */
  .card-sub .age-inline {
    color: #b8511d;
  }

  /* 方案 B: 浅底色条 */
  .age-bar {
    margin-top: 14px;
    padding: 8px 12px;
    border-radius: 6px;
    background: #fff8f6;
    border: 1px solid rgba(229, 94, 85, 0.15);
    font-size: 0.78rem;
    color: #c54e3a;
    text-align: center;
  }

  /* 方案 C: 同灰色调融入底部 */
  .age-muted {
    margin-top: 12px;
    text-align: center;
    font-size: 0.75rem;
    color: #8c919e;
  }
</style>
</head>
<body>

<div class="label">方案 A — 融入副标题文案</div>
<div class="card">
  <div class="card-title">请选择您的观展身份</div>
  <div class="card-sub">请选择您的观展身份，我们将为您发放对应的观展票。<span class="age-inline">16岁以下观众禁止入场，请勿注册。</span></div>
  <div class="role-options">
    <button class="role-option is-active" type="button">
      <span class="role-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 9.25c0-1.8 1.45-3.25 3.25-3.25h9.5A3.25 3.25 0 0 1 20 9.25v7.5A3.25 3.25 0 0 1 16.75 20h-9.5A3.25 3.25 0 0 1 4 16.75v-7.5Z" stroke="currentColor" stroke-width="1.6"/><path d="M8 6V4.75A1.75 1.75 0 0 1 9.75 3h4.5A1.75 1.75 0 0 1 16 4.75V6" stroke="currentColor" stroke-width="1.6"/><path d="M4 12.5h16" stroke="currentColor" stroke-width="1.6"/></svg></span>
      <span class="role-content"><span class="role-title">专业观众注册<span class="role-tag need">需审核</span></span><span class="role-desc">4 月 27-29 日展区票（<span class="role-num">3</span> 日票）</span></span>
    </button>
    <button class="role-option" type="button">
      <span class="role-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M5 19.5c0-3.3 2.95-5.5 7-5.5s7 2.2 7 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="role-content"><span class="role-title">消费者注册<span class="role-tag free">免审核</span></span><span class="role-desc">4 月 29 日展区票（<span class="role-num">1</span> 日票）</span></span>
    </button>
  </div>
</div>

<div class="label">方案 B — 浅底色提示条</div>
<div class="card">
  <div class="card-title">请选择您的观展身份</div>
  <div class="card-sub">请选择您的观展身份，我们将为您发放对应的观展票。</div>
  <div class="role-options">
    <button class="role-option is-active" type="button">
      <span class="role-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 9.25c0-1.8 1.45-3.25 3.25-3.25h9.5A3.25 3.25 0 0 1 20 9.25v7.5A3.25 3.25 0 0 1 16.75 20h-9.5A3.25 3.25 0 0 1 4 16.75v-7.5Z" stroke="currentColor" stroke-width="1.6"/><path d="M8 6V4.75A1.75 1.75 0 0 1 9.75 3h4.5A1.75 1.75 0 0 1 16 4.75V6" stroke="currentColor" stroke-width="1.6"/><path d="M4 12.5h16" stroke="currentColor" stroke-width="1.6"/></svg></span>
      <span class="role-content"><span class="role-title">专业观众注册<span class="role-tag need">需审核</span></span><span class="role-desc">4 月 27-29 日展区票（<span class="role-num">3</span> 日票）</span></span>
    </button>
    <button class="role-option" type="button">
      <span class="role-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M5 19.5c0-3.3 2.95-5.5 7-5.5s7 2.2 7 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="role-content"><span class="role-title">消费者注册<span class="role-tag free">免审核</span></span><span class="role-desc">4 月 29 日展区票（<span class="role-num">1</span> 日票）</span></span>
    </button>
  </div>
  <div class="age-bar">16岁以下观众禁止入场，请勿注册！</div>
</div>

<div class="label">方案 C — 灰色低调融入</div>
<div class="card">
  <div class="card-title">请选择您的观展身份</div>
  <div class="card-sub">请选择您的观展身份，我们将为您发放对应的观展票。</div>
  <div class="role-options">
    <button class="role-option is-active" type="button">
      <span class="role-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 9.25c0-1.8 1.45-3.25 3.25-3.25h9.5A3.25 3.25 0 0 1 20 9.25v7.5A3.25 3.25 0 0 1 16.75 20h-9.5A3.25 3.25 0 0 1 4 16.75v-7.5Z" stroke="currentColor" stroke-width="1.6"/><path d="M8 6V4.75A1.75 1.75 0 0 1 9.75 3h4.5A1.75 1.75 0 0 1 16 4.75V6" stroke="currentColor" stroke-width="1.6"/><path d="M4 12.5h16" stroke="currentColor" stroke-width="1.6"/></svg></span>
      <span class="role-content"><span class="role-title">专业观众注册<span class="role-tag need">需审核</span></span><span class="role-desc">4 月 27-29 日展区票（<span class="role-num">3</span> 日票）</span></span>
    </button>
    <button class="role-option" type="button">
      <span class="role-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M5 19.5c0-3.3 2.95-5.5 7-5.5s7 2.2 7 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="role-content"><span class="role-title">消费者注册<span class="role-tag free">免审核</span></span><span class="role-desc">4 月 29 日展区票（<span class="role-num">1</span> 日票）</span></span>
    </button>
  </div>
  <p class="age-muted">16岁以下观众禁止入场，请勿注册</p>
</div>

</body>
</html>
