name: Backfill Feishu Metadata

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 "backfill-feishu-metadata" 确认执行补写'
        required: true
        type: string
      mode:
        description: '执行模式'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      limit:
        description: '最多处理记录数'
        required: true
        default: '5000'
        type: string
      batch_size:
        description: '每批查询条数'
        required: true
        default: '200'
        type: string
      list_page_size:
        description: '读取多维表格记录的分页大小（最大500）'
        required: true
        default: '500'
        type: string

jobs:
  backfill:
    if: github.event.inputs.confirm == 'backfill-feishu-metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Build API Dist
        run: |
          set -euo pipefail
          npm ci --prefix apps/api
          npm run build --prefix apps/api

      - name: Validate SSH Key
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_SSH_KEY_B64: ${{ secrets.ALIYUN_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          mkdir -p ~/.ssh

          if [ -n "${ALIYUN_SSH_KEY:-}" ]; then
            KEY_HEAD="$(printf '%s' "${ALIYUN_SSH_KEY}" | head -n 1)"
            if printf '%s' "${KEY_HEAD}" | grep -qE '^ssh-(ed25519|rsa|dss) '; then
              echo '::error::ALIYUN_SSH_KEY looks like a public key. Please set the private key content.'
              exit 1
            fi
            RAW_KEY="$(printf '%b' "${ALIYUN_SSH_KEY}" | tr -d '\r')"
            printf '%s' "${RAW_KEY}" > ~/.ssh/id_aliyun
          elif [ -n "${ALIYUN_SSH_KEY_B64:-}" ]; then
            printf '%s' "${ALIYUN_SSH_KEY_B64}" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_aliyun
          else
            echo '::error::Missing Actions secret: ALIYUN_SSH_KEY or ALIYUN_SSH_KEY_B64'
            exit 1
          fi

          chmod 600 ~/.ssh/id_aliyun
          ssh-keygen -y -f ~/.ssh/id_aliyun >/dev/null

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            'echo SSH_OK' >/tmp/ssh_probe.out

          grep -q SSH_OK /tmp/ssh_probe.out

      - name: Run Backfill On Active API Container
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          MODE: ${{ github.event.inputs.mode }}
          LIMIT: ${{ github.event.inputs.limit }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          LIST_PAGE_SIZE: ${{ github.event.inputs.list_page_size }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          scp \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            apps/api/dist/scripts/backfill-feishu-metadata.js \
            "${USER}@${HOST}:/tmp/backfill-feishu-metadata.js"

          scp \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            apps/api/dist/services/feishuService.js \
            "${USER}@${HOST}:/tmp/feishuService.js"

          REMOTE_ENV="$(printf \
            'APP_DIR=%q MODE=%q LIMIT=%q BATCH_SIZE=%q LIST_PAGE_SIZE=%q COMPOSE_PROJECT_NAME=%q' \
            "${APP_DIR:-/opt/web-fbif-form}" "${MODE}" "${LIMIT}" "${BATCH_SIZE}" "${LIST_PAGE_SIZE}" "fbif-form")"

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            "${REMOTE_ENV} bash -s --" <<'REMOTE'
          set -euo pipefail

          ACTIVE_SLOT="legacy"
          if [ -f "${APP_DIR}/shared/active_slot" ]; then
            ACTIVE_SLOT="$(tr -d '[:space:]' < "${APP_DIR}/shared/active_slot")"
          fi

          case "${ACTIVE_SLOT}" in
            blue|green)
              TARGET_CONTAINER="${COMPOSE_PROJECT_NAME}-api-${ACTIVE_SLOT}"
              ;;
            *)
              TARGET_CONTAINER="${COMPOSE_PROJECT_NAME}-api-1"
              ;;
          esac

          if ! docker ps --format '{{.Names}}' | grep -qx "${TARGET_CONTAINER}"; then
            for candidate in \
              "${COMPOSE_PROJECT_NAME}-api-blue" \
              "${COMPOSE_PROJECT_NAME}-api-green" \
              "${COMPOSE_PROJECT_NAME}-api-1"
            do
              if docker ps --format '{{.Names}}' | grep -qx "${candidate}"; then
                TARGET_CONTAINER="${candidate}"
                break
              fi
            done
          fi

          docker ps --format '{{.Names}}' | grep -qx "${TARGET_CONTAINER}" || {
            echo "ERROR: no running API container found" >&2
            exit 1
          }

          CMD="node dist/scripts/backfill-feishu-metadata.js --limit ${LIMIT} --batch-size ${BATCH_SIZE} --list-page-size ${LIST_PAGE_SIZE}"
          if [ "${MODE}" = "dry-run" ]; then
            CMD="${CMD} --dry-run"
          fi

          docker exec "${TARGET_CONTAINER}" sh -lc "mkdir -p /app/dist/scripts /app/dist/services"
          docker cp /tmp/backfill-feishu-metadata.js "${TARGET_CONTAINER}:/app/dist/scripts/backfill-feishu-metadata.js"
          docker cp /tmp/feishuService.js "${TARGET_CONTAINER}:/app/dist/services/feishuService.js"

          echo "TARGET_CONTAINER=${TARGET_CONTAINER}"
          echo "RUN_MODE=${MODE}"

          if [ "${MODE}" = "apply" ]; then
            IMAGE="$(docker inspect -f '{{.Config.Image}}' "${TARGET_CONTAINER}")"
            POSTGRES_CONTAINER=""
            for candidate in \
              "${COMPOSE_PROJECT_NAME}-postgres-1" \
              "${COMPOSE_PROJECT_NAME}-postgres-blue" \
              "${COMPOSE_PROJECT_NAME}-postgres-green"
            do
              if docker ps --format '{{.Names}}' | grep -qx "${candidate}"; then
                POSTGRES_CONTAINER="${candidate}"
                break
              fi
            done
            [ -n "${POSTGRES_CONTAINER}" ] || { echo "ERROR: postgres container not found" >&2; exit 1; }

            POSTGRES_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "${POSTGRES_CONTAINER}" | awk '{print $1}')"
            [ -n "${POSTGRES_IP}" ] || { echo "ERROR: postgres IP not found" >&2; exit 1; }

            ENV_FILE="/tmp/backfill-env.list"
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "${TARGET_CONTAINER}" > "${ENV_FILE}"
            DB_URL="$(grep '^DATABASE_URL=' "${ENV_FILE}" | tail -n1 | cut -d= -f2-)"
            [ -n "${DB_URL}" ] || { echo "ERROR: DATABASE_URL missing in container env" >&2; exit 1; }
            DB_URL_HOST="${DB_URL/@postgres:5432/@${POSTGRES_IP}:5432}"

            echo "BACKFILL_IMAGE=${IMAGE}"
            echo "POSTGRES_CONTAINER=${POSTGRES_CONTAINER}"
            echo "POSTGRES_IP=${POSTGRES_IP}"

            docker run --rm \
              --network host \
              --entrypoint node \
              --env-file "${ENV_FILE}" \
              -e "DATABASE_URL=${DB_URL_HOST}" \
              -v /tmp/backfill-feishu-metadata.js:/app/dist/scripts/backfill-feishu-metadata.js:ro \
              -v /tmp/feishuService.js:/app/dist/services/feishuService.js:ro \
              "${IMAGE}" \
              /app/dist/scripts/backfill-feishu-metadata.js \
              --limit "${LIMIT}" \
              --batch-size "${BATCH_SIZE}" \
              --list-page-size "${LIST_PAGE_SIZE}"
          else
            docker exec "${TARGET_CONTAINER}" sh -lc "${CMD}"
          fi
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_aliyun /tmp/backfill-feishu-metadata.js /tmp/feishuService.js
