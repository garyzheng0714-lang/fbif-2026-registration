name: Deploy To Aliyun

on:
  # push to main auto-deploy disabled for safety; re-enable after staging stabilises
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fbif_form
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fbif_form"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mock-api/package-lock.json
            apps/api/package-lock.json

      - name: Build And Test
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          set -euo pipefail
          API_URL="${VITE_API_URL:-/api}"

          npm ci --prefix apps/api
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/fbif_form" npm run prisma:migrate --prefix apps/api
          npm test --prefix apps/api
          npm run build --prefix apps/api

          npm ci --prefix apps/mock-api
          npm test --prefix apps/mock-api
          npm ci --prefix apps/web
          VITE_API_URL="${API_URL}" VITE_BUILD_SHA="${GITHUB_SHA:-dev}" npm run build --prefix apps/web

      - name: Package Release
        run: |
          set -euo pipefail
          rm -f /tmp/release.tgz release.tgz
          tar -czf /tmp/release.tgz \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="release.tgz" \
            --exclude="./release.tgz" \
            --exclude="apps/web/node_modules" \
            --exclude="apps/mock-api/node_modules" \
            --exclude="apps/api/node_modules" \
            --exclude="apps/web/.env" \
            --exclude="apps/web/.env.*" \
            --exclude="apps/mock-api/.env" \
            --exclude="apps/mock-api/.env.*" \
            --exclude="apps/api/.env" \
            --exclude="apps/api/.env.*" \
            --exclude=".local-stack" \
            .
          cp /tmp/release.tgz release.tgz

      - name: Validate SSH Key
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_SSH_KEY_B64: ${{ secrets.ALIYUN_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-112.124.103.65}"
          USER="${ALIYUN_USER:-root}"

          mkdir -p ~/.ssh

          if [ -n "${ALIYUN_SSH_KEY:-}" ]; then
            KEY_HEAD="$(printf '%s' "${ALIYUN_SSH_KEY}" | head -n 1)"
            if printf '%s' "${KEY_HEAD}" | grep -qE '^ssh-(ed25519|rsa|dss) '; then
              echo "::error::ALIYUN_SSH_KEY looks like a public key. Please set the private key content."
              exit 1
            fi

            RAW_KEY="$(printf '%b' "${ALIYUN_SSH_KEY}" | tr -d '\r')"
            if printf '%s' "${RAW_KEY}" | grep -q -- '-----BEGIN OPENSSH PRIVATE KEY-----'; then
              printf '%s\n' "${RAW_KEY}" | awk '
                /-----BEGIN OPENSSH PRIVATE KEY-----/ {in_key=1}
                in_key {print}
                /-----END OPENSSH PRIVATE KEY-----/ {if (in_key) {exit}}
              ' > ~/.ssh/id_aliyun
            else
              printf '%s' "${RAW_KEY}" > ~/.ssh/id_aliyun
            fi
          elif [ -n "${ALIYUN_SSH_KEY_B64:-}" ]; then
            printf '%s' "${ALIYUN_SSH_KEY_B64}" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_aliyun
          else
            echo "::error::Missing Actions secret: ALIYUN_SSH_KEY or ALIYUN_SSH_KEY_B64"
            exit 1
          fi

          chmod 600 ~/.ssh/id_aliyun

          if ! ssh-keygen -y -f ~/.ssh/id_aliyun >/dev/null 2>/tmp/ssh_key_err.log; then
            echo "::error::Invalid private key content in Actions secret."
            cat /tmp/ssh_key_err.log || true
            exit 1
          fi

          if ! ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            "echo SSH_OK" >/tmp/ssh_probe_out.log 2>/tmp/ssh_probe_err.log; then
            if grep -qi "Permission denied" /tmp/ssh_probe_err.log; then
              echo "::error::SSH authentication failed. Ensure the public key is in server ~/.ssh/authorized_keys."
            elif grep -Eqi "Connection timed out|No route to host|Connection refused" /tmp/ssh_probe_err.log; then
              echo "::error::Cannot reach server SSH port 22 from GitHub Actions. Check Aliyun security group/firewall."
            else
              echo "::error::SSH probe failed. See logs below."
            fi
            cat /tmp/ssh_probe_err.log || true
            exit 1
          fi

          grep -q "SSH_OK" /tmp/ssh_probe_out.log

      - name: Upload Release To Server
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-112.124.103.65}"
          USER="${ALIYUN_USER:-root}"

          scp \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            release.tgz \
            "${USER}@${HOST}:/tmp/release.tgz"

      - name: Deploy On Server
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          STATIC_DIR: ${{ secrets.STATIC_DIR }}
          API_PORT: ${{ secrets.API_PORT }}
          API_PORT_INTERNAL: ${{ secrets.API_PORT_INTERNAL }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
          CSRF_COOKIE_SECURE: ${{ secrets.CSRF_COOKIE_SECURE }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DATA_HASH_SALT: ${{ secrets.DATA_HASH_SALT }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_HOST: ${{ secrets.OSS_HOST }}
          OSS_PUBLIC_BASE_URL: ${{ secrets.OSS_PUBLIC_BASE_URL }}
          OSS_UPLOAD_PREFIX: ${{ secrets.OSS_UPLOAD_PREFIX }}
          OSS_MAX_UPLOAD_MB: ${{ secrets.OSS_MAX_UPLOAD_MB }}
          OSS_POLICY_EXPIRE_SECONDS: ${{ secrets.OSS_POLICY_EXPIRE_SECONDS }}
          OSS_OBJECT_ACL: ${{ secrets.OSS_OBJECT_ACL }}
          ID_VERIFY_ENABLED: ${{ secrets.ID_VERIFY_ENABLED }}
          ID_VERIFY_ALIYUN_HOST: ${{ secrets.ID_VERIFY_ALIYUN_HOST }}
          ID_VERIFY_ALIYUN_PATH: ${{ secrets.ID_VERIFY_ALIYUN_PATH }}
          ID_VERIFY_APPCODE: ${{ secrets.ID_VERIFY_APPCODE }}
          ID_VERIFY_TIMEOUT_MS: ${{ secrets.ID_VERIFY_TIMEOUT_MS }}
          ID_VERIFY_TOKEN_TTL_SECONDS: ${{ secrets.ID_VERIFY_TOKEN_TTL_SECONDS }}
          RATE_LIMIT_WINDOW_MS: ${{ secrets.RATE_LIMIT_WINDOW_MS }}
          RATE_LIMIT_MAX: ${{ secrets.RATE_LIMIT_MAX }}
          RATE_LIMIT_BURST: ${{ secrets.RATE_LIMIT_BURST }}
          SYNC_POLL_TIMEOUT_MS: ${{ secrets.SYNC_POLL_TIMEOUT_MS }}
          FEISHU_SYNC_ATTEMPTS: ${{ secrets.FEISHU_SYNC_ATTEMPTS }}
          FEISHU_SYNC_BACKOFF_MS: ${{ secrets.FEISHU_SYNC_BACKOFF_MS }}
          FEISHU_SYNC_BACKOFF_MAX_MS: ${{ secrets.FEISHU_SYNC_BACKOFF_MAX_MS }}
          FEISHU_WORKER_CONCURRENCY: ${{ secrets.FEISHU_WORKER_CONCURRENCY }}
          FEISHU_WORKER_QPS: ${{ secrets.FEISHU_WORKER_QPS }}
          FEISHU_SELECT_WRITE_MODE: ${{ secrets.FEISHU_SELECT_WRITE_MODE }}
          MAX_PROOF_URLS: ${{ secrets.MAX_PROOF_URLS }}
          MAX_PROOF_URL_LENGTH: ${{ secrets.MAX_PROOF_URL_LENGTH }}
          FEISHU_FIELD_SOURCE: ${{ secrets.FEISHU_FIELD_SOURCE }}
          FEISHU_FIELD_TRACKING_PARAMS: ${{ secrets.FEISHU_FIELD_TRACKING_PARAMS }}
          FEISHU_FIELD_TRACKING_ID: ${{ secrets.FEISHU_FIELD_TRACKING_ID }}
          FEISHU_FIELD_TRACKING_ID_TYPE: ${{ secrets.FEISHU_FIELD_TRACKING_ID_TYPE }}
          FEISHU_SUBMISSION_SOURCE: ${{ secrets.FEISHU_SUBMISSION_SOURCE }}
          FEISHU_ALERT_WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
          FEISHU_ALERT_ENABLED: ${{ secrets.FEISHU_ALERT_ENABLED }}
          RUN_DB_MIGRATE: ${{ secrets.RUN_DB_MIGRATE }}
          RUN_WORKER: ${{ secrets.RUN_WORKER }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-112.124.103.65}"
          USER="${ALIYUN_USER:-root}"

          REMOTE_ENV="$(printf \
            "APP_DIR=%q STATIC_DIR=%q API_PORT=%q API_PORT_INTERNAL=%q WEB_ORIGIN=%q CSRF_COOKIE_SECURE=%q POSTGRES_USER=%q POSTGRES_PASSWORD=%q POSTGRES_DB=%q DATA_KEY=%q DATA_HASH_SALT=%q FEISHU_APP_ID=%q FEISHU_APP_SECRET=%q FEISHU_APP_TOKEN=%q FEISHU_TABLE_ID=%q OSS_ACCESS_KEY_ID=%q OSS_ACCESS_KEY_SECRET=%q OSS_BUCKET=%q OSS_REGION=%q OSS_HOST=%q OSS_PUBLIC_BASE_URL=%q OSS_UPLOAD_PREFIX=%q OSS_MAX_UPLOAD_MB=%q OSS_POLICY_EXPIRE_SECONDS=%q OSS_OBJECT_ACL=%q ID_VERIFY_ENABLED=%q ID_VERIFY_ALIYUN_HOST=%q ID_VERIFY_ALIYUN_PATH=%q ID_VERIFY_APPCODE=%q ID_VERIFY_TIMEOUT_MS=%q ID_VERIFY_TOKEN_TTL_SECONDS=%q RATE_LIMIT_WINDOW_MS=%q RATE_LIMIT_MAX=%q RATE_LIMIT_BURST=%q SYNC_POLL_TIMEOUT_MS=%q FEISHU_SYNC_ATTEMPTS=%q FEISHU_SYNC_BACKOFF_MS=%q FEISHU_SYNC_BACKOFF_MAX_MS=%q FEISHU_WORKER_CONCURRENCY=%q FEISHU_WORKER_QPS=%q FEISHU_SELECT_WRITE_MODE=%q MAX_PROOF_URLS=%q MAX_PROOF_URL_LENGTH=%q FEISHU_FIELD_SOURCE=%q FEISHU_FIELD_TRACKING_PARAMS=%q FEISHU_FIELD_TRACKING_ID=%q FEISHU_FIELD_TRACKING_ID_TYPE=%q FEISHU_SUBMISSION_SOURCE=%q FEISHU_ALERT_WEBHOOK=%q FEISHU_ALERT_ENABLED=%q RUN_DB_MIGRATE=%q RUN_WORKER=%q GH_SHA=%q RELEASE_TGZ=%q" \
            "${APP_DIR:-}" "${STATIC_DIR:-}" "${API_PORT:-}" "${API_PORT_INTERNAL:-}" "${WEB_ORIGIN:-}" "${CSRF_COOKIE_SECURE:-}" "${POSTGRES_USER:-}" "${POSTGRES_PASSWORD:-}" "${POSTGRES_DB:-}" "${DATA_KEY:-}" "${DATA_HASH_SALT:-}" "${FEISHU_APP_ID:-}" "${FEISHU_APP_SECRET:-}" "${FEISHU_APP_TOKEN:-}" "${FEISHU_TABLE_ID:-}" "${OSS_ACCESS_KEY_ID:-}" "${OSS_ACCESS_KEY_SECRET:-}" "${OSS_BUCKET:-}" "${OSS_REGION:-}" "${OSS_HOST:-}" "${OSS_PUBLIC_BASE_URL:-}" "${OSS_UPLOAD_PREFIX:-}" "${OSS_MAX_UPLOAD_MB:-}" "${OSS_POLICY_EXPIRE_SECONDS:-}" "${OSS_OBJECT_ACL:-}" "${ID_VERIFY_ENABLED:-}" "${ID_VERIFY_ALIYUN_HOST:-}" "${ID_VERIFY_ALIYUN_PATH:-}" "${ID_VERIFY_APPCODE:-}" "${ID_VERIFY_TIMEOUT_MS:-}" "${ID_VERIFY_TOKEN_TTL_SECONDS:-}" "${RATE_LIMIT_WINDOW_MS:-}" "${RATE_LIMIT_MAX:-}" "${RATE_LIMIT_BURST:-}" "${SYNC_POLL_TIMEOUT_MS:-}" "${FEISHU_SYNC_ATTEMPTS:-}" "${FEISHU_SYNC_BACKOFF_MS:-}" "${FEISHU_SYNC_BACKOFF_MAX_MS:-}" "${FEISHU_WORKER_CONCURRENCY:-}" "${FEISHU_WORKER_QPS:-}" "${FEISHU_SELECT_WRITE_MODE:-}" "${MAX_PROOF_URLS:-}" "${MAX_PROOF_URL_LENGTH:-}" "${FEISHU_FIELD_SOURCE:-}" "${FEISHU_FIELD_TRACKING_PARAMS:-}" "${FEISHU_FIELD_TRACKING_ID:-}" "${FEISHU_FIELD_TRACKING_ID_TYPE:-}" "${FEISHU_SUBMISSION_SOURCE:-}" "${FEISHU_ALERT_WEBHOOK:-}" "${FEISHU_ALERT_ENABLED:-}" "${RUN_DB_MIGRATE:-}" "${RUN_WORKER:-}" "${GH_SHA}" "/tmp/release.tgz")"

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            "${REMOTE_ENV} bash -s" < scripts/remote-deploy.sh

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_aliyun /tmp/release.tgz release.tgz
