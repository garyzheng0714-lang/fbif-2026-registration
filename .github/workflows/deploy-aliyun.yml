name: Deploy To Aliyun

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 "deploy" 确认部署到生产环境'
        required: true
        type: string
      mode:
        description: '发布模式'
        required: true
        default: deploy
        type: choice
        options:
          - dry-run
          - deploy

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-test:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fbif_form
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fbif_form"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mock-api/package-lock.json
            apps/api/package-lock.json

      - name: Install, Test And Build
        run: |
          set -euo pipefail
          API_URL="/api"

          npm ci --prefix apps/api
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/fbif_form" npm run prisma:migrate --prefix apps/api
          npm test --prefix apps/api
          npm run build --prefix apps/api

          npm ci --prefix apps/mock-api
          npm test --prefix apps/mock-api

          npm ci --prefix apps/web
          VITE_API_URL="${API_URL}" VITE_BUILD_SHA="${GITHUB_SHA:-dev}" npm run build --prefix apps/web

      - name: Package Release
        run: |
          set -euo pipefail
          rm -f /tmp/release.tgz release.tgz
          tar -czf /tmp/release.tgz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='release.tgz' \
            --exclude='./release.tgz' \
            --exclude='apps/web/node_modules' \
            --exclude='apps/mock-api/node_modules' \
            --exclude='apps/api/node_modules' \
            --exclude='apps/web/.env' \
            --exclude='apps/web/.env.*' \
            --exclude='apps/mock-api/.env' \
            --exclude='apps/mock-api/.env.*' \
            --exclude='apps/api/.env' \
            --exclude='apps/api/.env.*' \
            --exclude='.local-stack' \
            .
          cp /tmp/release.tgz release.tgz

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-production
          path: release.tgz
          retention-days: 7

  preflight-remote:
    if: github.event.inputs.confirm == 'deploy'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Validate SSH Key
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_SSH_KEY_B64: ${{ secrets.ALIYUN_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          mkdir -p ~/.ssh

          if [ -n "${ALIYUN_SSH_KEY:-}" ]; then
            KEY_HEAD="$(printf '%s' "${ALIYUN_SSH_KEY}" | head -n 1)"
            if printf '%s' "${KEY_HEAD}" | grep -qE '^ssh-(ed25519|rsa|dss) '; then
              echo '::error::ALIYUN_SSH_KEY looks like a public key. Please set the private key content.'
              exit 1
            fi
            RAW_KEY="$(printf '%b' "${ALIYUN_SSH_KEY}" | tr -d '\r')"
            printf '%s' "${RAW_KEY}" > ~/.ssh/id_aliyun
          elif [ -n "${ALIYUN_SSH_KEY_B64:-}" ]; then
            printf '%s' "${ALIYUN_SSH_KEY_B64}" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_aliyun
          else
            echo '::error::Missing Actions secret: ALIYUN_SSH_KEY or ALIYUN_SSH_KEY_B64'
            exit 1
          fi

          chmod 600 ~/.ssh/id_aliyun
          ssh-keygen -y -f ~/.ssh/id_aliyun >/dev/null

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            'echo SSH_OK' >/tmp/ssh_probe.out

          grep -q SSH_OK /tmp/ssh_probe.out

      - name: Remote Preflight Gate
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          STATIC_DIR: ${{ secrets.STATIC_DIR }}
          API_PORT: ${{ secrets.API_PORT }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          REMOTE_ENV="$(printf \
            'APP_DIR=%q STATIC_DIR=%q API_PORT=%q PRIMARY_WEB_PORT=%q NGINX_SITE_NAME=%q COMPOSE_PROJECT_NAME=%q' \
            "${APP_DIR:-/opt/web-fbif-form}" "${STATIC_DIR:-/var/www/fbif-form}" "${API_PORT:-8080}" "3001" "fbif-form" "fbif-form")"

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            "${REMOTE_ENV} bash -s -- preflight" < scripts/remote-deploy.sh

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_aliyun

  prepare-candidate:
    if: github.event.inputs.confirm == 'deploy'
    needs:
      - build-test
      - preflight-remote
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      candidate_slot: ${{ steps.prepare.outputs.candidate_slot }}
      candidate_api_port: ${{ steps.prepare.outputs.candidate_api_port }}
      candidate_web_port: ${{ steps.prepare.outputs.candidate_web_port }}

    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Download Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-production

      - name: Validate SSH Key
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_SSH_KEY_B64: ${{ secrets.ALIYUN_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          mkdir -p ~/.ssh

          if [ -n "${ALIYUN_SSH_KEY:-}" ]; then
            KEY_HEAD="$(printf '%s' "${ALIYUN_SSH_KEY}" | head -n 1)"
            if printf '%s' "${KEY_HEAD}" | grep -qE '^ssh-(ed25519|rsa|dss) '; then
              echo '::error::ALIYUN_SSH_KEY looks like a public key. Please set the private key content.'
              exit 1
            fi
            RAW_KEY="$(printf '%b' "${ALIYUN_SSH_KEY}" | tr -d '\r')"
            printf '%s' "${RAW_KEY}" > ~/.ssh/id_aliyun
          elif [ -n "${ALIYUN_SSH_KEY_B64:-}" ]; then
            printf '%s' "${ALIYUN_SSH_KEY_B64}" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_aliyun
          else
            echo '::error::Missing Actions secret: ALIYUN_SSH_KEY or ALIYUN_SSH_KEY_B64'
            exit 1
          fi

          chmod 600 ~/.ssh/id_aliyun
          ssh-keygen -y -f ~/.ssh/id_aliyun >/dev/null

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            'echo SSH_OK' >/tmp/ssh_probe.out

          grep -q SSH_OK /tmp/ssh_probe.out

      - name: Upload Release To Server
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          scp \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            release.tgz \
            "${USER}@${HOST}:/tmp/release.tgz"

      - name: Prepare Candidate Slot
        id: prepare
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          STATIC_DIR: ${{ secrets.STATIC_DIR }}
          API_PORT: ${{ secrets.API_PORT }}
          API_PORT_INTERNAL: ${{ secrets.API_PORT_INTERNAL }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
          CSRF_COOKIE_SECURE: ${{ secrets.CSRF_COOKIE_SECURE }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DATA_HASH_SALT: ${{ secrets.DATA_HASH_SALT }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_HOST: ${{ secrets.OSS_HOST }}
          OSS_PUBLIC_BASE_URL: ${{ secrets.OSS_PUBLIC_BASE_URL }}
          OSS_UPLOAD_PREFIX: ${{ secrets.OSS_UPLOAD_PREFIX }}
          OSS_MAX_UPLOAD_MB: ${{ secrets.OSS_MAX_UPLOAD_MB }}
          OSS_POLICY_EXPIRE_SECONDS: ${{ secrets.OSS_POLICY_EXPIRE_SECONDS }}
          OSS_OBJECT_ACL: ${{ secrets.OSS_OBJECT_ACL }}
          ID_VERIFY_ENABLED: ${{ secrets.ID_VERIFY_ENABLED }}
          ID_VERIFY_ALIYUN_HOST: ${{ secrets.ID_VERIFY_ALIYUN_HOST }}
          ID_VERIFY_ALIYUN_PATH: ${{ secrets.ID_VERIFY_ALIYUN_PATH }}
          ID_VERIFY_APPCODE: ${{ secrets.ID_VERIFY_APPCODE }}
          ID_VERIFY_TIMEOUT_MS: ${{ secrets.ID_VERIFY_TIMEOUT_MS }}
          ID_VERIFY_TOKEN_TTL_SECONDS: ${{ secrets.ID_VERIFY_TOKEN_TTL_SECONDS }}
          RATE_LIMIT_WINDOW_MS: ${{ secrets.RATE_LIMIT_WINDOW_MS }}
          RATE_LIMIT_MAX: ${{ secrets.RATE_LIMIT_MAX }}
          RATE_LIMIT_BURST: ${{ secrets.RATE_LIMIT_BURST }}
          SYNC_POLL_TIMEOUT_MS: ${{ secrets.SYNC_POLL_TIMEOUT_MS }}
          FEISHU_SYNC_ATTEMPTS: ${{ secrets.FEISHU_SYNC_ATTEMPTS }}
          FEISHU_SYNC_BACKOFF_MS: ${{ secrets.FEISHU_SYNC_BACKOFF_MS }}
          FEISHU_SYNC_BACKOFF_MAX_MS: ${{ secrets.FEISHU_SYNC_BACKOFF_MAX_MS }}
          FEISHU_WORKER_CONCURRENCY: ${{ secrets.FEISHU_WORKER_CONCURRENCY }}
          FEISHU_WORKER_QPS: ${{ secrets.FEISHU_WORKER_QPS }}
          FEISHU_SELECT_WRITE_MODE: ${{ secrets.FEISHU_SELECT_WRITE_MODE }}
          MAX_PROOF_URLS: ${{ secrets.MAX_PROOF_URLS }}
          MAX_PROOF_URL_LENGTH: ${{ secrets.MAX_PROOF_URL_LENGTH }}
          FEISHU_FIELD_CLICK_ID: ${{ secrets.FEISHU_FIELD_CLICK_ID }}
          FEISHU_FIELD_CLICK_ID_SOURCE_KEY: ${{ secrets.FEISHU_FIELD_CLICK_ID_SOURCE_KEY }}
          FEISHU_FIELD_SOURCE: ${{ secrets.FEISHU_FIELD_SOURCE }}
          FEISHU_FIELD_TRACKING_PARAMS: ${{ secrets.FEISHU_FIELD_TRACKING_PARAMS }}
          FEISHU_FIELD_TRACKING_ID: ${{ secrets.FEISHU_FIELD_TRACKING_ID }}
          FEISHU_FIELD_TRACKING_ID_TYPE: ${{ secrets.FEISHU_FIELD_TRACKING_ID_TYPE }}
          FEISHU_SUBMISSION_SOURCE: ${{ secrets.FEISHU_SUBMISSION_SOURCE }}
          FEISHU_ALERT_WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
          FEISHU_ALERT_ENABLED: ${{ secrets.FEISHU_ALERT_ENABLED }}
          RUN_DB_MIGRATE: ${{ secrets.RUN_DB_MIGRATE }}
          RUN_WORKER: ${{ secrets.RUN_WORKER }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          PREPARE_LOG="$(mktemp)"

          REMOTE_ENV="$(printf \
            'APP_DIR=%q STATIC_DIR=%q API_PORT=%q API_PORT_INTERNAL=%q WEB_ORIGIN=%q CSRF_COOKIE_SECURE=%q POSTGRES_USER=%q POSTGRES_PASSWORD=%q POSTGRES_DB=%q DATA_KEY=%q DATA_HASH_SALT=%q FEISHU_APP_ID=%q FEISHU_APP_SECRET=%q FEISHU_APP_TOKEN=%q FEISHU_TABLE_ID=%q OSS_ACCESS_KEY_ID=%q OSS_ACCESS_KEY_SECRET=%q OSS_BUCKET=%q OSS_REGION=%q OSS_HOST=%q OSS_PUBLIC_BASE_URL=%q OSS_UPLOAD_PREFIX=%q OSS_MAX_UPLOAD_MB=%q OSS_POLICY_EXPIRE_SECONDS=%q OSS_OBJECT_ACL=%q ID_VERIFY_ENABLED=%q ID_VERIFY_ALIYUN_HOST=%q ID_VERIFY_ALIYUN_PATH=%q ID_VERIFY_APPCODE=%q ID_VERIFY_TIMEOUT_MS=%q ID_VERIFY_TOKEN_TTL_SECONDS=%q RATE_LIMIT_WINDOW_MS=%q RATE_LIMIT_MAX=%q RATE_LIMIT_BURST=%q SYNC_POLL_TIMEOUT_MS=%q FEISHU_SYNC_ATTEMPTS=%q FEISHU_SYNC_BACKOFF_MS=%q FEISHU_SYNC_BACKOFF_MAX_MS=%q FEISHU_WORKER_CONCURRENCY=%q FEISHU_WORKER_QPS=%q FEISHU_SELECT_WRITE_MODE=%q MAX_PROOF_URLS=%q MAX_PROOF_URL_LENGTH=%q FEISHU_FIELD_CLICK_ID=%q FEISHU_FIELD_CLICK_ID_SOURCE_KEY=%q FEISHU_FIELD_SOURCE=%q FEISHU_FIELD_TRACKING_PARAMS=%q FEISHU_FIELD_TRACKING_ID=%q FEISHU_FIELD_TRACKING_ID_TYPE=%q FEISHU_SUBMISSION_SOURCE=%q FEISHU_ALERT_WEBHOOK=%q FEISHU_ALERT_ENABLED=%q RUN_DB_MIGRATE=%q RUN_WORKER=%q GH_SHA=%q RELEASE_TGZ=%q PRIMARY_WEB_PORT=%q CANDIDATE_WEB_PORT=%q NGINX_SITE_NAME=%q COMPOSE_PROJECT_NAME=%q BLUE_API_PORT=%q GREEN_API_PORT=%q ROLLBACK_WINDOW_SECONDS=%q ROLLBACK_CHECK_INTERVAL_SECONDS=%q ROLLBACK_MAX_CONSEC_FAILS=%q ROLLBACK_MAX_5XX=%q ROLLBACK_MAX_TIMEOUTS=%q ROLLBACK_SUBMISSION_MIN_FINALIZED=%q ROLLBACK_SUBMISSION_MIN_SUCCESS_PERCENT=%q ROLLBACK_SUBMISSION_MAX_FAILED=%q' \
            "${APP_DIR:-/opt/web-fbif-form}" "${STATIC_DIR:-/var/www/fbif-form}" "${API_PORT:-8080}" "${API_PORT_INTERNAL:-8080}" "${WEB_ORIGIN:-}" "${CSRF_COOKIE_SECURE:-}" "${POSTGRES_USER:-}" "${POSTGRES_PASSWORD:-}" "${POSTGRES_DB:-}" "${DATA_KEY:-}" "${DATA_HASH_SALT:-}" "${FEISHU_APP_ID:-}" "${FEISHU_APP_SECRET:-}" "${FEISHU_APP_TOKEN:-}" "${FEISHU_TABLE_ID:-}" "${OSS_ACCESS_KEY_ID:-}" "${OSS_ACCESS_KEY_SECRET:-}" "${OSS_BUCKET:-}" "${OSS_REGION:-}" "${OSS_HOST:-}" "${OSS_PUBLIC_BASE_URL:-}" "${OSS_UPLOAD_PREFIX:-}" "${OSS_MAX_UPLOAD_MB:-}" "${OSS_POLICY_EXPIRE_SECONDS:-}" "${OSS_OBJECT_ACL:-}" "${ID_VERIFY_ENABLED:-}" "${ID_VERIFY_ALIYUN_HOST:-}" "${ID_VERIFY_ALIYUN_PATH:-}" "${ID_VERIFY_APPCODE:-}" "${ID_VERIFY_TIMEOUT_MS:-}" "${ID_VERIFY_TOKEN_TTL_SECONDS:-}" "${RATE_LIMIT_WINDOW_MS:-}" "${RATE_LIMIT_MAX:-}" "${RATE_LIMIT_BURST:-}" "${SYNC_POLL_TIMEOUT_MS:-}" "${FEISHU_SYNC_ATTEMPTS:-}" "${FEISHU_SYNC_BACKOFF_MS:-}" "${FEISHU_SYNC_BACKOFF_MAX_MS:-}" "${FEISHU_WORKER_CONCURRENCY:-}" "${FEISHU_WORKER_QPS:-}" "${FEISHU_SELECT_WRITE_MODE:-}" "${MAX_PROOF_URLS:-}" "${MAX_PROOF_URL_LENGTH:-}" "${FEISHU_FIELD_CLICK_ID:-}" "${FEISHU_FIELD_CLICK_ID_SOURCE_KEY:-}" "${FEISHU_FIELD_SOURCE:-}" "${FEISHU_FIELD_TRACKING_PARAMS:-}" "${FEISHU_FIELD_TRACKING_ID:-}" "${FEISHU_FIELD_TRACKING_ID_TYPE:-}" "${FEISHU_SUBMISSION_SOURCE:-}" "${FEISHU_ALERT_WEBHOOK:-}" "${FEISHU_ALERT_ENABLED:-}" "${RUN_DB_MIGRATE:-}" "${RUN_WORKER:-}" "${GH_SHA}" '/tmp/release.tgz' '3001' '3002' 'fbif-form' 'fbif-form' '8080' '18080' '180' '15' '3' '6' '6' '3' '85' '2')"

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            "${REMOTE_ENV} bash -s -- prepare" < scripts/remote-deploy.sh | tee "${PREPARE_LOG}"

          CANDIDATE_SLOT="$(grep '^CANDIDATE_SLOT=' "${PREPARE_LOG}" | tail -n 1 | cut -d= -f2-)"
          CANDIDATE_API_PORT="$(grep '^CANDIDATE_API_PORT=' "${PREPARE_LOG}" | tail -n 1 | cut -d= -f2-)"
          CANDIDATE_WEB_PORT="$(grep '^CANDIDATE_WEB_PORT=' "${PREPARE_LOG}" | tail -n 1 | cut -d= -f2-)"

          [ -n "${CANDIDATE_SLOT}" ] || { echo '::error::Missing CANDIDATE_SLOT from prepare output'; exit 1; }
          [ -n "${CANDIDATE_API_PORT}" ] || { echo '::error::Missing CANDIDATE_API_PORT from prepare output'; exit 1; }
          [ -n "${CANDIDATE_WEB_PORT}" ] || { echo '::error::Missing CANDIDATE_WEB_PORT from prepare output'; exit 1; }

          echo "candidate_slot=${CANDIDATE_SLOT}" >> "$GITHUB_OUTPUT"
          echo "candidate_api_port=${CANDIDATE_API_PORT}" >> "$GITHUB_OUTPUT"
          echo "candidate_web_port=${CANDIDATE_WEB_PORT}" >> "$GITHUB_OUTPUT"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_aliyun release.tgz

  browser-e2e-gate:
    if: github.event.inputs.confirm == 'deploy'
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate SSH Key
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_SSH_KEY_B64: ${{ secrets.ALIYUN_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          mkdir -p ~/.ssh

          if [ -n "${ALIYUN_SSH_KEY:-}" ]; then
            RAW_KEY="$(printf '%b' "${ALIYUN_SSH_KEY}" | tr -d '\r')"
            printf '%s' "${RAW_KEY}" > ~/.ssh/id_aliyun
          elif [ -n "${ALIYUN_SSH_KEY_B64:-}" ]; then
            printf '%s' "${ALIYUN_SSH_KEY_B64}" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_aliyun
          else
            echo '::error::Missing Actions secret: ALIYUN_SSH_KEY or ALIYUN_SSH_KEY_B64'
            exit 1
          fi

          chmod 600 ~/.ssh/id_aliyun
          ssh-keygen -y -f ~/.ssh/id_aliyun >/dev/null

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            'echo SSH_OK' >/tmp/ssh_probe.out

          grep -q SSH_OK /tmp/ssh_probe.out

      - name: Install Playwright
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Run Real Browser E2E Gate (Industry + Consumer)
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          CANDIDATE_WEB_PORT: ${{ needs.prepare-candidate.outputs.candidate_web_port }}
          E2E_DISABLE_WEB_SECURITY: '1'
          VERIFY_NAME: 郑梽煌
          VERIFY_ID: 35052519981217001X
          VERIFY_PHONE: 13800000001
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"
          LOCAL_TUNNEL_PORT=39001

          cleanup() {
            if [ -n "${TUNNEL_PID:-}" ] && kill -0 "${TUNNEL_PID}" >/dev/null 2>&1; then
              kill "${TUNNEL_PID}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=accept-new \
            -N \
            -L "${LOCAL_TUNNEL_PORT}:127.0.0.1:${CANDIDATE_WEB_PORT}" \
            "${USER}@${HOST}" &
          TUNNEL_PID=$!

          sleep 2
          kill -0 "${TUNNEL_PID}" >/dev/null 2>&1

          E2E_BASE_URL="http://127.0.0.1:${LOCAL_TUNNEL_PORT}" \
          E2E_PROOF_FILE="$(pwd)/apps/web/public/banner.png" \
          VERIFY_NAME="${VERIFY_NAME}" \
          VERIFY_ID="${VERIFY_ID}" \
          VERIFY_PHONE="${VERIFY_PHONE}" \
          node scripts/e2e-real-form-gate.mjs

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_aliyun package.json package-lock.json

  promote-or-rollback:
    if: always() && github.event.inputs.confirm == 'deploy'
    needs:
      - prepare-candidate
      - browser-e2e-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Validate SSH Key
        if: needs.prepare-candidate.result == 'success'
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_SSH_KEY_B64: ${{ secrets.ALIYUN_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          mkdir -p ~/.ssh

          if [ -n "${ALIYUN_SSH_KEY:-}" ]; then
            RAW_KEY="$(printf '%b' "${ALIYUN_SSH_KEY}" | tr -d '\r')"
            printf '%s' "${RAW_KEY}" > ~/.ssh/id_aliyun
          elif [ -n "${ALIYUN_SSH_KEY_B64:-}" ]; then
            printf '%s' "${ALIYUN_SSH_KEY_B64}" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_aliyun
          else
            echo '::error::Missing Actions secret: ALIYUN_SSH_KEY or ALIYUN_SSH_KEY_B64'
            exit 1
          fi

          chmod 600 ~/.ssh/id_aliyun
          ssh-keygen -y -f ~/.ssh/id_aliyun >/dev/null

      - name: Promote Candidate (Deploy Mode)
        if: needs.prepare-candidate.result == 'success' && needs.browser-e2e-gate.result == 'success' && github.event.inputs.mode == 'deploy'
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          STATIC_DIR: ${{ secrets.STATIC_DIR }}
          API_PORT: ${{ secrets.API_PORT }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          REMOTE_ENV="$(printf \
            'APP_DIR=%q STATIC_DIR=%q API_PORT=%q PRIMARY_WEB_PORT=%q NGINX_SITE_NAME=%q COMPOSE_PROJECT_NAME=%q BLUE_API_PORT=%q GREEN_API_PORT=%q ROLLBACK_WINDOW_SECONDS=%q ROLLBACK_CHECK_INTERVAL_SECONDS=%q ROLLBACK_MAX_CONSEC_FAILS=%q ROLLBACK_MAX_5XX=%q ROLLBACK_MAX_TIMEOUTS=%q ROLLBACK_SUBMISSION_MIN_FINALIZED=%q ROLLBACK_SUBMISSION_MIN_SUCCESS_PERCENT=%q ROLLBACK_SUBMISSION_MAX_FAILED=%q' \
            "${APP_DIR:-/opt/web-fbif-form}" "${STATIC_DIR:-/var/www/fbif-form}" "${API_PORT:-8080}" "3001" "fbif-form" "fbif-form" "8080" "18080" "180" "15" "3" "6" "6" "3" "85" "2")"

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            "${REMOTE_ENV} bash -s -- promote" < scripts/remote-deploy.sh

      - name: Discard Candidate (Dry-Run Or Gate Failed)
        if: needs.prepare-candidate.result == 'success' && (github.event.inputs.mode != 'deploy' || needs.browser-e2e-gate.result != 'success')
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          STATIC_DIR: ${{ secrets.STATIC_DIR }}
          API_PORT: ${{ secrets.API_PORT }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-121.40.214.5}"
          USER="${ALIYUN_USER:-root}"

          REMOTE_ENV="$(printf \
            'APP_DIR=%q STATIC_DIR=%q API_PORT=%q PRIMARY_WEB_PORT=%q NGINX_SITE_NAME=%q COMPOSE_PROJECT_NAME=%q BLUE_API_PORT=%q GREEN_API_PORT=%q' \
            "${APP_DIR:-/opt/web-fbif-form}" "${STATIC_DIR:-/var/www/fbif-form}" "${API_PORT:-8080}" "3001" "fbif-form" "fbif-form" "8080" "18080")"

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            "${REMOTE_ENV} bash -s -- discard" < scripts/remote-deploy.sh

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_aliyun
