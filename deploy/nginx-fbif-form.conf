# FBIF 2026 观众注册系统 - NGINX 配置
# 使用方法: 复制到 /etc/nginx/conf.d/ 并修改以下变量:
#   - server_name: 改为实际域名
#   - root: 改为静态文件实际路径
#   - proxy_pass: 确认后端 API 端口 (默认 8080)
#   - ssl_certificate / ssl_certificate_key: 如需 HTTPS 请取消注释并填写证书路径

server {
    listen 80;
    # listen 443 ssl http2;
    server_name fbif2026ticket.foodtalks.cn;

    # --- HTTPS (按需启用) ---
    # ssl_certificate     /etc/nginx/ssl/fbif2026ticket.foodtalks.cn.pem;
    # ssl_certificate_key /etc/nginx/ssl/fbif2026ticket.foodtalks.cn.key;
    # ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/fbif-form;
    index index.html;

    client_max_body_size 2m;

    # --- 静态资源 (Vite 构建产物, 带 hash 文件名, 长期缓存) ---
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- API 反向代理 → Docker 后端容器 ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # --- 后端健康检查 (可选, 供监控使用) ---
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    # --- SPA 前端路由回退 ---
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
